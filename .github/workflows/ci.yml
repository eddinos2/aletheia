name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: test
        run: cargo test --workspace
      - name: evalfx
        run: cargo test evalfx
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
